[project]
name = "wf"
version = "0.1.0"
description = "Agentic workflows: audit a written process, make its gaps explicit, run it and show where it guesses."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "anthropic>=1.0",
    "httpx>=0.27",
    "fpdf2>=2.8",
    "markdown>=3.6",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "jsonschema>=4.22",
]

[project.scripts]
wf = "wf.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pypdf>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:starlette.testclient"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/wf/api/app.py" = ["B008"]  # FastAPI's Body(...) defaults are the framework idiom
