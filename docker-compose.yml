services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wf
      POSTGRES_PASSWORD: wf
      POSTGRES_DB: wf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wf -d wf"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      args:
        # The app writes into the mounted workspace, so the container user has to
        # own those files. UID=$(id -u) GID=$(id -g) docker compose up --build
        # when the mount shows up as something other than 1000:1000.
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Runs, steps, decisions and sessions live here (the db service above). Outside
      # Compose it defaults to SQLite at var/wf.db.
      WF_DATABASE_URL: postgresql+psycopg://wf:wf@db:5432/wf
      # The model provider's key, read by the Anthropic SDK. The startup log says which
      # provider was chosen and whether its key is set, never the key itself.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # OpenRouter instead: one key for many vendors' models, named vendor/model.
      # With only this key set, it is used without saying so; WF_MODEL_PROVIDER
      # (anthropic | openrouter) settles it when both keys are here.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      WF_MODEL_PROVIDER: ${WF_MODEL_PROVIDER:-}
      # Ask the gateway to enforce the output schema rather than suggest it. Off by
      # default: not every provider behind it accepts every schema.
      WF_OPENROUTER_STRICT: ${WF_OPENROUTER_STRICT:-}
      # Live web search and page fetch for the research step, in dry and real runs.
      # Without it, search reads workspace/fixtures/search.json and contents.json.
      # An Exa error (bad key, spent quota) shows on the research step with Exa's reason.
      EXA_API_KEY: ${EXA_API_KEY:-}
      # exa | recorded. Empty means exa when the key is set. recorded keeps a past case
      # replaying the way it happened; live search makes it diverge from what was recorded.
      WF_SEARCH: ${WF_SEARCH:-}
      # live | recorded. Empty means live: every cited URL is requested from this
      # container (10s, redirects followed); URLs in fixtures/http.json replay instead.
      # A 403 from here can be bot protection, not a dead link; the run says the vantage.
      WF_LINK_CHECK: ${WF_LINK_CHECK:-}
      # Definitions, instructions, schemas, cases and fixtures: the ./workspace mount below.
      # Saving a draft commits into it, so it must be writable by the container user.
      WF_WORKSPACE: /app/workspace
      # The two levels of judgement a step runs at. Empty uses the defaults in
      # src/wf/settings.py, which is the only place a model is named in the code.
      WF_QUICK_MODEL: ${WF_QUICK_MODEL:-}
      WF_CAREFUL_MODEL: ${WF_CAREFUL_MODEL:-}
      # What the system uses on its own behalf. Each falls back to a level above.
      WF_EXTRACTION_MODEL: ${WF_EXTRACTION_MODEL:-}   # reads a document, proposes steps (careful)
      WF_SKILL_MODEL: ${WF_SKILL_MODEL:-}             # writes each step's instructions (extraction)
      WF_CHAT_MODEL: ${WF_CHAT_MODEL:-}               # answers in the draft chat (quick)
      # written | template. template lays each step's instructions out with no model call.
      WF_SKILLS: ${WF_SKILLS:-}
      WF_GUESS_MODEL: ${WF_GUESS_MODEL:-}             # fills a gap the document left (quick)
      # How much one answer may run to before it is cut off. Answers are streamed, so
      # this can be as high as the model in use allows; lower it for one that allows
      # less, raise it if reading a long document into a draft runs out of room.
      WF_MAX_OUTPUT_TOKENS: ${WF_MAX_OUTPUT_TOKENS:-}
      # $ per million tokens as {"model": [input, output]}; empty uses the built-in table.
      WF_MODEL_PRICING: ${WF_MODEL_PRICING:-}
      # Set to 1 to run offline against the fake model instead of the API. No key needed,
      # no cost, and the answers are canned: useful to tell "the model" from "the code".
      WF_FAKE_MODEL: ${WF_FAKE_MODEL:-}
      # How loud, in what shape, and where. Level: debug | info | warning | error;
      # debug prints every prompt and answer. Format: text | json (json for log tools).
      WF_LOG_LEVEL: ${WF_LOG_LEVEL:-info}
      WF_LOG_FORMAT: ${WF_LOG_FORMAT:-text}
      # The healthcheck asks for /healthz every 30 seconds. Its access lines go to a log
      # of their own so they do not fill this one; WF_LOG_HEALTHCHECK=on puts them back.
      WF_HEALTH_LOG_FILE: ${WF_HEALTH_LOG_FILE:-/app/var/health.log}
      WF_LOG_HEALTHCHECK: ${WF_LOG_HEALTHCHECK:-}
      # What is kept of each agentic session: full (prompts and answers), meta (counts and
      # timings only), off. The run page's "What it was asked" and "What it searched and
      # read" come from here, so they are empty unless this is full.
      WF_SESSION_LOG: ${WF_SESSION_LOG:-full}
      # Each prompt, answer and tool result is clipped to this many characters when
      # stored. Empty means 40000; raise it if a recorded page or prompt looks cut short.
      WF_SESSION_MAX_CHARS: ${WF_SESSION_MAX_CHARS:-}
      # Where each session is also mirrored, one file per session.
      WF_SESSION_ROOT: ${WF_SESSION_ROOT:-/app/var/sessions}
      # Where run artefacts (the PDFs) are written, one folder per run id. On the wfvar
      # volume; docker compose cp app:/app/var/artifacts . copies them out.
      WF_ARTIFACTS_DIR: ${WF_ARTIFACTS_DIR:-/app/var/artifacts}
    volumes:
      - ./workspace:/app/workspace
      - wfvar:/app/var

volumes:
  pgdata:
  wfvar:
